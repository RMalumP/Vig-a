name: Vigía

on:
  schedule:
    # Cada 5 minutos (GitHub puede retrasarlo unos minutos en horas de mucha carga)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    # Solo se ejecuta donde el propietario ha creado la variable VIGIA_ACTIVO desde Vigía.
    # Las copias (forks) no heredan variables ni secretos, así que ahí no hace nada.
    if: vars.VIGIA_ACTIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el script
        uses: actions/checkout@v4
        with:
          sparse-checkout: vigia
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vigia/package-lock.json

      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: vigia-estado.json
          key: vigia-estado-${{ github.run_id }}
          restore-keys: vigia-estado-

      - name: Instalar dependencias
        working-directory: vigia
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Comprobar páginas
        run: node vigia/vigia-action.mjs
        env:
          # GitHub escribe en el registro (público en repositorios públicos) las
          # variables de entorno de cada paso. Con VIGIA_GH_TOKEN la lista se lee
          # por la API y no aparece; sin él, no queda más remedio que pasarla aquí.
          VIGIA_CONFIG: ${{ secrets.VIGIA_GH_TOKEN == '' && vars.VIGIA_CONFIG || '' }}
          VIGIA_CLAVE: ${{ secrets.VIGIA_CLAVE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Solo para servidores ntfy privados que piden identificación.
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASS: ${{ secrets.NTFY_PASS }}
          # Opcional: permite guardar en VIGIA_CONFIG lo que se cambie desde el bot
          # de Telegram con la web cerrada. Token con «Variables: Read and write».
          VIGIA_GH_TOKEN: ${{ secrets.VIGIA_GH_TOKEN }}
          ESTADO: vigia-estado.json

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vigia-estado.json
          key: vigia-estado-${{ github.run_id }}
